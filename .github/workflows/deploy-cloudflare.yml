name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run verify

      - name: Resolve Cloudflare authentication
        id: cloudflare
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${CF_TOKEN:-}" && -n "${CF_ACCOUNT:-}" ]]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_ACCOUNT_ID=$CF_ACCOUNT" >> "$GITHUB_ENV"
          else
            echo "mode=device" >> "$GITHUB_OUTPUT"
          fi

      - name: Authorize Wrangler with Cloudflare
        if: steps.cloudflare.outputs.mode == 'device'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/cf-device-public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAtsK9SSLZt05jV3mAPhW5
          3miLIrAeQ8ZBsoH7oiRHCWc+EnPlr1YQxtVPPSlQOBFfPxMGnRgyFoJN3rJXF6m3
          P0JY6wyUQx+ZTb/huspV+3JwLzMRSECXmkBwYqYLa+rnO82LOtbIMxV4zY+TkyKD
          0IJNMBhjnxoMI+Ljr2ROtUXmgrOxC1hOxrdDHRIDKePKeYDxmjO/0NWdirbJqnih
          WRcqhOvhrtRIpK+3rPXCqRmmKmM6O42Se3T17QxeIu0ensoFWmniQrkSu3t36GzM
          s4yUuW5Jn5EaVZ5jPrV15sQb9f5jm+e5u1aQX3ZkcAzdjvv95etU2ldE9ku8oPEZ
          xQIDAQAB
          -----END PUBLIC KEY-----
          EOF

          log=/tmp/wrangler-device.log
          (
            stdbuf -oL -eL npx --yes wrangler@4.119.0 login --device --browser=false 2>&1 | tee "$log"
          ) &
          login_pid=$!

          posted=0
          for attempt in {1..90}; do
            code="$(python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("/tmp/wrangler-device.log")
          s = p.read_text(errors="ignore") if p.exists() else ""
          s = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", s)
          m = re.search(r"enter the code:\s*\n\s*([A-Za-z0-9_-]{6,20})", s, re.I)
          print(m.group(1) if m else "")
          PY
          )"
            if [[ -n "$code" && "$posted" == "0" ]]; then
              printf '%s' "$code" | openssl pkeyutl -encrypt -pubin -inkey /tmp/cf-device-public.pem -pkeyopt rsa_padding_mode:oaep | base64 -w0 > /tmp/cf-device.cipher
              cipher="$(cat /tmp/cf-device.cipher)"
              payload="$(jq -n --arg body "CF_DEVICE_CIPHERTEXT:$cipher" '{body:$body}')"
              curl -fsS -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/43/comments" \
                -d "$payload" >/dev/null
              posted=1
              unset code cipher payload
              break
            fi
            sleep 1
          done

          [[ "$posted" == "1" ]] || { echo "::error::Could not capture Cloudflare device code."; kill "$login_pid" || true; exit 1; }
          wait "$login_pid"

      - name: Resolve the Azarakhsh Cloudflare account
        if: steps.cloudflare.outputs.mode == 'device'
        shell: bash
        run: |
          set -euo pipefail
          whoami="$(npx --yes wrangler@4.119.0 whoami --json)"
          token="$(npx --yes wrangler@4.119.0 auth token --json | jq -r '.token')"
          test -n "$token"
          echo "::add-mask::$token"
          db_id="130db9f3-ff76-4d0d-bccb-196af0248e15"
          target=""
          while IFS= read -r account_id; do
            [[ -n "$account_id" ]] || continue
            status="$(curl -sS -o /tmp/cf-db.json -w "%{http_code}"               -H "Authorization: Bearer $token"               "https://api.cloudflare.com/client/v4/accounts/$account_id/d1/database/$db_id" || true)"
            if [[ "$status" == "200" ]] && [[ "$(jq -r '.success // false' /tmp/cf-db.json)" == "true" ]]; then
              target="$account_id"
              break
            fi
          done < <(jq -r '.accounts[]?.id // empty' <<<"$whoami")
          if [[ -z "$target" ]]; then
            echo "::error::Could not locate the Cloudflare account that owns the Azarakhsh D1 database."
            exit 1
          fi
          echo "::add-mask::$target"
          echo "CLOUDFLARE_ACCOUNT_ID=$target" >> "$GITHUB_ENV"

      - name: Deploy Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 deploy

      - name: Smoke test deployed Worker
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://azarakhsh-foundation.com14.workers.dev"
          routes=(
            "/" "/about" "/council" "/beheshti" "/archive" "/publications"
            "/standards" "/governance" "/contribute" "/contact" "/privacy"
            "/publications/hazarajat-1358-uprising-to-regional-government"
            "/en" "/join" "/login" "/robots.txt" "/sitemap.xml"
            "/.well-known/security.txt" "/api/posts"
          )
          for attempt in {1..12}; do
            if curl -fsS --max-time 20 "$BASE/" >/dev/null; then break; fi
            sleep 5
          done
          for path in "${routes[@]}"; do
            code=$(curl -sS -L -o /tmp/body -w "%{http_code}" --max-time 25 "$BASE$path" || echo "000")
            echo "$code $path"
            if [[ "$code" == "000" || "$code" -lt 200 || "$code" -ge 400 ]]; then
              echo "::error::Smoke test failed for $path with HTTP $code"
              exit 1
            fi
            if [[ "$path" == "/publications/hazarajat-1358-uprising-to-regional-government" ]]; then
              grep -Fq "آنچه ۴۷ سال در سایه مانده است" /tmp/body || {
                echo "::error::Article body is missing from deployed route."
                exit 1
              }
              if grep -Fq "بخشی از سایت درست بارگذاری نشد" /tmp/body; then
                echo "::error::Deployed article rendered the application error boundary."
                exit 1
              fi
            fi
          done

      - name: Browser-test deployed article hydration
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://azarakhsh-foundation.com14.workers.dev"
          ARTICLE="$BASE/publications/hazarajat-1358-uprising-to-regional-government"
          CHROME=""
          for bin in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$bin" >/dev/null 2>&1; then CHROME=$(command -v "$bin"); break; fi
          done
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "$ARTICLE" > /tmp/article-dom.html
          grep -Fq "آنچه ۴۷ سال در سایه مانده است" /tmp/article-dom.html || {
            echo "::error::Hydrated article title is missing in a real browser."
            exit 1
          }
          if grep -Fq "بخشی از سایت درست بارگذاری نشد" /tmp/article-dom.html; then
            echo "::error::Real browser reached the application error boundary after hydration."
            exit 1
          fi

