name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run verify

      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials are not configured; storing the verified production bundle instead of failing the workflow."
          fi

      - name: Deploy Worker
        if: steps.cloudflare.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke test deployed Worker
        if: steps.cloudflare.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://azarakhsh-foundation.com14.workers.dev"
          routes=(
            "/" "/about" "/council" "/beheshti" "/archive" "/publications"
            "/standards" "/governance" "/contribute" "/contact" "/privacy"
            "/publications/hazarajat-1358-uprising-to-regional-government"
            "/en" "/join" "/login" "/robots.txt" "/sitemap.xml"
            "/.well-known/security.txt" "/api/posts"
          )
          for attempt in {1..12}; do
            if curl -fsS --max-time 20 "$BASE/" >/dev/null; then break; fi
            sleep 5
          done
          for path in "${routes[@]}"; do
            code=$(curl -sS -L -o /tmp/body -w "%{http_code}" --max-time 25 "$BASE$path" || echo "000")
            echo "$code $path"
            if [[ "$code" == "000" || "$code" -lt 200 || "$code" -ge 400 ]]; then
              echo "::error::Smoke test failed for $path with HTTP $code"
              exit 1
            fi
          done

      - name: Store verified production bundle
        if: steps.cloudflare.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: azarakhsh-production-bundle
          path: dist/
          retention-days: 7
