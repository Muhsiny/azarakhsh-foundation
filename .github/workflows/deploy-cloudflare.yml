name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run verify

      - name: Resolve Cloudflare authentication
        id: cloudflare
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${CF_TOKEN:-}" && -n "${CF_ACCOUNT:-}" ]]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_ACCOUNT_ID=$CF_ACCOUNT" >> "$GITHUB_ENV"
          else
            echo "mode=device" >> "$GITHUB_OUTPUT"
          fi

      - name: Authorize Wrangler with Cloudflare
        if: steps.cloudflare.outputs.mode == 'device'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 login --device --browser=false

      - name: Resolve the Azarakhsh Cloudflare account
        if: steps.cloudflare.outputs.mode == 'device'
        shell: bash
        run: |
          set -euo pipefail
          whoami="$(npx --yes wrangler@4.119.0 whoami --json)"
          token="$(npx --yes wrangler@4.119.0 auth token --json | jq -r '.token')"
          test -n "$token"
          echo "::add-mask::$token"
          db_id="130db9f3-ff76-4d0d-bccb-196af0248e15"
          target=""
          while IFS= read -r account_id; do
            [[ -n "$account_id" ]] || continue
            status="$(curl -sS -o /tmp/cf-db.json -w "%{http_code}"               -H "Authorization: Bearer $token"               "https://api.cloudflare.com/client/v4/accounts/$account_id/d1/database/$db_id" || true)"
            if [[ "$status" == "200" ]] && [[ "$(jq -r '.success // false' /tmp/cf-db.json)" == "true" ]]; then
              target="$account_id"
              break
            fi
          done < <(jq -r '.accounts[]?.id // empty' <<<"$whoami")
          if [[ -z "$target" ]]; then
            echo "::error::Could not locate the Cloudflare account that owns the Azarakhsh D1 database."
            exit 1
          fi
          echo "::add-mask::$target"
          echo "CLOUDFLARE_ACCOUNT_ID=$target" >> "$GITHUB_ENV"

      - name: Deploy Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 deploy

      - name: Smoke test deployed Worker
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://azarakhsh-foundation.com14.workers.dev"
          routes=(
            "/" "/about" "/council" "/beheshti" "/archive" "/publications"
            "/standards" "/governance" "/contribute" "/contact" "/privacy"
            "/publications/hazarajat-1358-uprising-to-regional-government"
            "/en" "/join" "/login" "/robots.txt" "/sitemap.xml"
            "/.well-known/security.txt" "/api/posts"
          )
          for attempt in {1..12}; do
            if curl -fsS --max-time 20 "$BASE/" >/dev/null; then break; fi
            sleep 5
          done
          for path in "${routes[@]}"; do
            code=$(curl -sS -L -o /tmp/body -w "%{http_code}" --max-time 25 "$BASE$path" || echo "000")
            echo "$code $path"
            if [[ "$code" == "000" || "$code" -lt 200 || "$code" -ge 400 ]]; then
              echo "::error::Smoke test failed for $path with HTTP $code"
              exit 1
            fi
            if [[ "$path" == "/publications/hazarajat-1358-uprising-to-regional-government" ]]; then
              grep -Fq "از قیام پراکنده تا حکومت منطقه‌ای" /tmp/body || {
                echo "::error::Article body is missing from deployed route."
                exit 1
              }
              if grep -Fq "بخشی از سایت درست بارگذاری نشد" /tmp/body; then
                echo "::error::Deployed article rendered the application error boundary."
                exit 1
              fi
            fi
          done

      - name: Browser-test deployed article hydration
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://azarakhsh-foundation.com14.workers.dev"
          ARTICLE="$BASE/publications/hazarajat-1358-uprising-to-regional-government"
          CHROME=""
          for bin in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$bin" >/dev/null 2>&1; then CHROME=$(command -v "$bin"); break; fi
          done
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "$ARTICLE" > /tmp/article-dom.html
          grep -Fq "از قیام پراکنده تا حکومت منطقه‌ای" /tmp/article-dom.html || {
            echo "::error::Hydrated article title is missing in a real browser."
            exit 1
          }
          if grep -Fq "بخشی از سایت درست بارگذاری نشد" /tmp/article-dom.html; then
            echo "::error::Real browser reached the application error boundary after hydration."
            exit 1
          fi

