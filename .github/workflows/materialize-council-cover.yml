name: Materialize Council Cover

on:
  push:
    branches:
      - root-visual-final-2026-09-23
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: root-visual-final-2026-09-23
      - name: Decode exact user cover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/media
          cat .tmp/council-cover.b64.* | tr -d '\n\r ' | base64 -d > public/media/council-cover.webp
          test -s public/media/council-cover.webp
          file public/media/council-cover.webp
      - name: Commit binary asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/council-cover.webp
          git commit -m "Add exact council flag cover asset" || exit 0
          git push origin HEAD:root-visual-final-2026-09-23
