name: Build Android and Windows Apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/build-apps.yml"

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install app dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build installable APK
        working-directory: apps/android
        run: ./gradlew assembleDebug
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Azarakhsh-Foundation-Android.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Azarakhsh-Foundation-Android
          path: apps/Azarakhsh-Foundation-Android.apk
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Azarakhsh-Foundation-Windows
          path: apps/release/*.exe
          if-no-files-found: error
