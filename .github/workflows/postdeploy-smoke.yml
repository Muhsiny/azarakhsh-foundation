name: Post-deploy smoke test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Smoke test live Azarakhsh
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://azarakhsh-foundation.com14.workers.dev"
          routes=(
            "/"
            "/about"
            "/archive"
            "/beheshti"
            "/contact"
            "/contribute"
            "/join"
            "/login"
            "/admin/login"
            "/privacy"
            "/publications"
            "/standards"
            "/api/posts"
            "/api/settings"
            "/robots.txt"
            "/sitemap.xml"
            "/manifest.webmanifest"
            "/.well-known/security.txt"
          )

          fail=0
          for path in "${routes[@]}"; do
            code=$(curl -sS -L -o /tmp/body -w "%{http_code}" --max-time 25 "$BASE$path" || echo "000")
            echo "$code $path"
            if [[ "$code" == "000" || "$code" -ge 500 ]]; then
              fail=1
            fi
          done

          echo "--- security headers ---"
          curl -sSI --max-time 25 "$BASE/" | tr -d '\r' | grep -Ei '^(strict-transport-security|content-security-policy|x-content-type-options|referrer-policy|permissions-policy|x-frame-options):' || true

          if [[ "$fail" -ne 0 ]]; then
            echo "Smoke test detected a network or 5xx failure."
            exit 1
          fi
          echo "Smoke test passed: no checked route returned 5xx."
