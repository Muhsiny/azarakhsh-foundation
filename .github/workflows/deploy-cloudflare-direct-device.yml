name: Direct Cloudflare device deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-direct-device-production
  cancel-in-progress: true

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[cf-direct-device]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Request Cloudflare device authorization
        shell: bash
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          const clientId = '54d11594-84e4-41aa-b438-e81b8fa78ee7';
          const scopes = [
            'account:read',
            'user:read',
            'workers:write',
            'workers_kv:write',
            'workers_scripts:write',
            'd1:write'
          ];
          const body = new URLSearchParams({
            client_id: clientId,
            scope: [...scopes, 'offline_access'].join(' ')
          });
          const res = await fetch('https://dash.cloudflare.com/oauth2/device/auth', {
            method: 'POST',
            headers: {'content-type':'application/x-www-form-urlencoded'},
            body
          });
          const data = await res.json();
          if (!res.ok || !data.device_code || !data.user_code) {
            console.error(JSON.stringify(data));
            process.exit(1);
          }
          fs.writeFileSync('device-state.json', JSON.stringify(data));
          fs.writeFileSync('device-user.json', JSON.stringify({
            user_code: data.user_code,
            verification_uri: data.verification_uri,
            verification_uri_complete: data.verification_uri_complete || null,
            expires_in: data.expires_in
          }));
          console.log('Cloudflare device authorization requested successfully.');
          console.log('VERIFICATION_URI=' + data.verification_uri);
          console.log('USER_CODE=' + data.user_code);
          if (data.verification_uri_complete) console.log('VERIFICATION_URI_COMPLETE=' + data.verification_uri_complete);
          NODE

      - name: Publish approval code
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-approval-code
          path: device-user.json
          if-no-files-found: error
          retention-days: 1

      - name: Wait for Cloudflare approval and identify target account
        shell: bash
        run: |
          node <<'NODE'
          import fs from 'node:fs';

          const clientId = '54d11594-84e4-41aa-b438-e81b8fa78ee7';
          const state = JSON.parse(fs.readFileSync('device-state.json','utf8'));
          const deadline = Date.now() + Math.min(Number(state.expires_in || 300), 300) * 1000;
          let interval = Math.max(Number(state.interval || 1), 1) * 1000;

          async function cfJson(url, token) {
            const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
            let data = null;
            try { data = await res.json(); } catch {}
            return { res, data };
          }

          async function listAll(path, token) {
            const out = [];
            for (let page = 1; page <= 10; page++) {
              const sep = path.includes('?') ? '&' : '?';
              const {res, data} = await cfJson(
                'https://api.cloudflare.com/client/v4' + path + sep + 'page=' + page + '&per_page=50',
                token
              );
              if (!res.ok || !data?.success) break;
              const batch = Array.isArray(data.result) ? data.result : [];
              out.push(...batch);
              if (!data.result_info || page >= Number(data.result_info.total_pages || 1)) break;
            }
            return out;
          }

          while (Date.now() < deadline) {
            const body = new URLSearchParams({
              grant_type: 'urn:ietf:params:oauth:grant-type:device_code',
              device_code: state.device_code,
              client_id: clientId
            });
            const res = await fetch('https://dash.cloudflare.com/oauth2/token', {
              method: 'POST',
              headers: {'content-type':'application/x-www-form-urlencoded'},
              body
            });
            const data = await res.json();

            if (data.access_token) {
              const token = data.access_token;
              console.log('::add-mask::' + token);
              fs.appendFileSync(process.env.GITHUB_ENV, 'CLOUDFLARE_API_TOKEN=' + token + '\n');

              const accounts = await listAll('/accounts', token);
              const memberships = await listAll('/memberships', token);
              const membershipIds = new Set(
                memberships.map(m => m?.account?.id).filter(Boolean)
              );
              const usable = membershipIds.size
                ? accounts.filter(a => membershipIds.has(a.id))
                : accounts;

              const candidates = usable.length ? usable : accounts;
              let selected = null;

              for (const account of candidates) {
                const workerCheck = await fetch(
                  'https://api.cloudflare.com/client/v4/accounts/' + account.id + '/workers/scripts/azarakhsh-foundation',
                  { headers: { Authorization: 'Bearer ' + token } }
                );
                if (workerCheck.ok) {
                  selected = account;
                  console.log('Target account matched existing Azarakhsh Worker.');
                  break;
                }
              }

              if (!selected) {
                const databaseId = '130db9f3-ff76-4d0d-bccb-196af0248e15';
                for (const account of candidates) {
                  const d1Check = await fetch(
                    'https://api.cloudflare.com/client/v4/accounts/' + account.id + '/d1/database/' + databaseId,
                    { headers: { Authorization: 'Bearer ' + token } }
                  );
                  if (d1Check.ok) {
                    selected = account;
                    console.log('Target account matched configured Azarakhsh D1 database.');
                    break;
                  }
                }
              }

              if (!selected && candidates.length === 1) {
                selected = candidates[0];
                console.log('Exactly one usable Cloudflare account is available.');
              }

              if (!selected) {
                console.error('Could not uniquely determine the target Cloudflare account.');
                console.error('Usable account count: ' + candidates.length);
                process.exit(1);
              }

              fs.appendFileSync(process.env.GITHUB_ENV, 'CLOUDFLARE_ACCOUNT_ID=' + selected.id + '\n');
              console.log('Cloudflare approval received and target account identified.');
              process.exit(0);
            }

            if (data.error === 'authorization_pending') {
              await new Promise(r => setTimeout(r, interval));
              continue;
            }
            if (data.error === 'slow_down') {
              interval += 5000;
              await new Promise(r => setTimeout(r, interval));
              continue;
            }
            console.error('Cloudflare authorization failed:', data.error || JSON.stringify(data));
            process.exit(1);
          }

          console.error('Cloudflare approval timed out.');
          process.exit(1);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run verify

      - name: Deploy Worker
        run: npx wrangler deploy
