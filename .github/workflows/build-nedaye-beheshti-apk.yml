name: Build Nedaye Beheshti Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - nedaye-beheshti-native
    paths:
      - 'nedaye-beheshti-native/**'
      - '.github/workflows/build-nedaye-beheshti-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nedaye-beheshti-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare bundled offline Quran and adhan
        shell: bash
        run: |
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets app/src/main/res/raw
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen

          def get(url, path):
              req=Request(url,headers={'User-Agent':'Nedaye-Beheshti-Native-Builder/1.5'})
              data=urlopen(req,timeout=90).read()
              Path(path).write_bytes(data)
              print(path, len(data))

          get('https://api.alquran.cloud/v1/quran/quran-uthmani','app/src/main/assets/quran_ar.json')
          get('https://api.alquran.cloud/v1/quran/fa.makarem','app/src/main/assets/quran_fa.json')
          normal='https://raw.githubusercontent.com/Kiwifu/adhan-mp3/main/Mishary_Al_Afasy_-_HQ_(%D9%85%D8%B4%D8%A7%D8%B1%D9%8A_%D8%A7%D9%84%D8%B9%D9%81%D8%A7%D8%B3%D9%8A).mp3'
          fajr='https://raw.githubusercontent.com/Kiwifu/adhan-mp3/main/Adhan_Fajr_Al_Haram_Al_Maki_(%D8%A3%D8%B0%D8%A7%D9%86_%D8%A7%D9%84%D9%81%D8%AC%D8%B1_%D8%A7%D9%84%D8%AD%D8%B1%D9%85_%D8%A7%D9%84%D9%85%D9%83%D9%8A).mp3'
          get(normal,'app/src/main/res/raw/default_adhan.mp3')
          try:
              get(fajr,'app/src/main/res/raw/default_fajr_adhan.mp3')
          except Exception:
              Path('app/src/main/res/raw/default_fajr_adhan.mp3').write_bytes(Path('app/src/main/res/raw/default_adhan.mp3').read_bytes())
          PY
      - name: Verify true native source
        run: |
          ! grep -RniE 'android.webkit.WebView|appdeploy|overlay\.js' app/src/main/java app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
      - name: Build native APK
        run: gradle :app:assembleDebug
      - name: Verify APK has bundled content and no web shell
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/quran_ar.json'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'res/raw/default_adhan'
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'; then echo 'web shell found' && exit 1; fi
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Nedaye-Beheshti-Native-1.5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Nedaye-Beheshti-Native-APK
          path: nedaye-beheshti-native/app/build/outputs/apk/debug/Nedaye-Beheshti-Native-1.5.apk
          if-no-files-found: error
