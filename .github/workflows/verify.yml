name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security-hardening-2026-09-19]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint, typecheck, and build
        run: npm run verify
      - name: Create transfer ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          zip -r azarakhsh-foundation-transfer.zip . -x ".git/*" "node_modules/*" ".github/*"
      - name: Upload transfer ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: azarakhsh-foundation-transfer
          path: azarakhsh-foundation-transfer.zip
          retention-days: 7
