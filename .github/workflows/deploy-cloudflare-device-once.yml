name: One-time Cloudflare device deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-device-production
  cancel-in-progress: false

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[cf-device-deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run verify

      - name: Authenticate Cloudflare with device flow
        run: npx wrangler login --device --browser=false

      - name: Show authenticated account
        run: npx wrangler whoami

      - name: Deploy Worker
        run: npx wrangler deploy
