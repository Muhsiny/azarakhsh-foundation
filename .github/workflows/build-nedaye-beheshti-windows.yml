name: Build Nedaye Beheshti Windows

on:
  workflow_dispatch:
  push:
    branches:
      - nedaye-beheshti-native
    paths:
      - 'nedaye-beheshti-windows/**'
      - '.github/workflows/build-nedaye-beheshti-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nedaye-beheshti-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nedaye-beheshti-windows/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows installer and portable app
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Nedaye-Beheshti-Windows
          path: |
            nedaye-beheshti-windows/dist/*.exe
          if-no-files-found: error
