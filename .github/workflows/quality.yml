name: Quality and Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject incomplete source markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'TODO|FIXME|@ts-ignore|console\.log\(' app worker --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs'; then
            echo "::error::Incomplete/debug source marker found."
            exit 1
          fi

      - name: Reject public CSS leaking into globals
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '^\.(hero|site-header|membership-page|publications-hero|archive-placeholder|knowledge-page)\b' app/globals.css; then
            echo "::error::Public presentation selector leaked back into globals.css."
            exit 1
          fi

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Start local QA server
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/azarakhsh-qa.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/azarakhsh-qa.log
          exit 1

      - name: Smoke test every public route
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            "/" "/about" "/council" "/beheshti" "/archive" "/publications"
            "/standards" "/governance" "/contribute" "/contact" "/privacy"
            "/en" "/join" "/login" "/admin/login"
          )
          for route in "${routes[@]}"; do
            echo "checking $route"
            curl -fsS --max-time 20 "http://127.0.0.1:4173$route" >/dev/null
          done

      - name: Real desktop and mobile browser QA
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          CHROME=""
          for bin in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$bin" >/dev/null 2>&1; then CHROME=$(command -v "$bin"); break; fi
          done
          test -n "$CHROME"
          mkdir -p visual-qa
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222             --user-data-dir=/tmp/azarakhsh-cdp about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:9222/json >/dev/null && break
            sleep 1
          done

          cat > /tmp/capture.mjs <<'NODE'
          import fs from "node:fs";

          const routes = [
            "/", "/about", "/council", "/beheshti", "/archive", "/publications",
            "/standards", "/governance", "/contribute", "/contact", "/privacy",
            "/en", "/join", "/login", "/admin/login"
          ];

          const pages = await (await fetch("http://127.0.0.1:9222/json")).json();
          const page = pages.find((item) => item.type === "page");
          if (!page) throw new Error("Chrome page target not found");

          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener("open", resolve, { once: true });
            ws.addEventListener("error", reject, { once: true });
          });

          let id = 0;
          const pending = new Map();
          ws.addEventListener("message", (event) => {
            const msg = JSON.parse(event.data);
            if (msg.id && pending.has(msg.id)) {
              pending.get(msg.id)(msg);
              pending.delete(msg.id);
            }
          });
          const send = (method, params = {}) => new Promise((resolve) => {
            const next = ++id;
            pending.set(next, resolve);
            ws.send(JSON.stringify({ id: next, method, params }));
          });

          await send("Page.enable");
          await send("Runtime.enable");

          async function navigate(path, width, height, mobile) {
            await send("Emulation.setDeviceMetricsOverride", {
              width, height, deviceScaleFactor: 1, mobile,
              screenWidth: width, screenHeight: height
            });
            await send("Page.navigate", { url: "http://127.0.0.1:4173" + path });
            await new Promise((resolve) => setTimeout(resolve, 1200));
            const result = await send("Runtime.evaluate", {
              expression: `(()=>({
                path: location.pathname,
                innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                bodyText: document.body.innerText.slice(0,500),
                brokenImages: [...document.images].filter(i => i.complete && i.naturalWidth === 0).map(i => i.getAttribute('src')),
                leaderSrc: document.querySelector('.az-home-portrait img')?.getAttribute('src') || null,
                homeCopyTop: document.querySelector('.az-home-copy')?.getBoundingClientRect().top ?? null,
                homePortraitTop: document.querySelector('.az-home-portrait')?.getBoundingClientRect().top ?? null,
                homePortraitHeight: document.querySelector('.az-home-portrait')?.getBoundingClientRect().height ?? null,
                basmalaCenter: document.querySelector('.az-sacred-basmala') ? (() => {
                  const r = document.querySelector('.az-sacred-basmala').getBoundingClientRect();
                  return r.left + r.width / 2;
                })() : null,
                homeLeadAlign: document.querySelector('.az-home-lead') ? getComputedStyle(document.querySelector('.az-home-lead')).textAlign : null
              }))()`,
              returnByValue: true
            });
            return result.result.result.value;
          }

          const failures = [];
          for (const path of routes) {
            const metrics = await navigate(path, 390, 844, true);
            fs.appendFileSync("visual-qa/mobile-metrics.jsonl", JSON.stringify(metrics) + "\n");
            if (metrics.scrollWidth > metrics.innerWidth + 1) {
              failures.push(`${path}: horizontal overflow ${metrics.scrollWidth} > ${metrics.innerWidth}`);
            }
            if (metrics.brokenImages.length) {
              failures.push(`${path}: broken images ${metrics.brokenImages.join(", ")}`);
            }
            if (/Internal Server Error|Application error/i.test(metrics.bodyText)) {
              failures.push(`${path}: application error visible`);
            }
            if (path === "/" && metrics.leaderSrc !== "/media/beheshti-original.webp") {
              failures.push(`/: expected original Beheshti portrait, got ${metrics.leaderSrc}`);
            }
            if (path === "/" && !(metrics.homeCopyTop < metrics.homePortraitTop)) {
              failures.push(`/: mobile hero message must appear before the leader portrait`);
            }
            if (path === "/" && metrics.homePortraitHeight > 430) {
              failures.push(`/: mobile leader feature is too tall (${metrics.homePortraitHeight}px)`);
            }
            if (path === "/" && Math.abs(metrics.basmalaCenter - metrics.innerWidth / 2) > 4) {
              failures.push(`/: Bismillah is not centered in the mobile sacred strip`);
            }
            if (path === "/" && metrics.homeLeadAlign !== "justify") {
              failures.push(`/: research lead text is not justified`);
            }
          }

          async function capture(name, path, width, height, mobile) {
            await navigate(path, width, height, mobile);
            const layout = await send("Page.getLayoutMetrics");
            const contentHeight = Math.min(Math.ceil(layout.result.cssContentSize.height), mobile ? 2600 : 2200);
            const shot = await send("Page.captureScreenshot", {
              format: "png",
              fromSurface: true,
              captureBeyondViewport: true,
              clip: { x: 0, y: 0, width, height: contentHeight, scale: 1 }
            });
            fs.writeFileSync("visual-qa/" + name + ".png", Buffer.from(shot.result.data, "base64"));
          }

          await capture("home-desktop", "/", 1440, 1000, false);
          await capture("home-mobile", "/", 390, 844, true);
          await capture("leader-desktop", "/beheshti", 1440, 1000, false);
          await capture("council-desktop", "/council", 1440, 1000, false);
          await capture("council-mobile", "/council", 390, 844, true);
          await capture("publications-desktop", "/publications", 1440, 1000, false);
          await capture("join-mobile", "/join", 390, 844, true);
          await capture("login-mobile", "/login", 390, 844, true);
          await capture("admin-login-mobile", "/admin/login", 390, 844, true);

          ws.close();

          if (failures.length) {
            console.error(failures.join("\n"));
            process.exit(1);
          }
          NODE

          node /tmp/capture.mjs

      - name: Upload visual QA
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: azarakhsh-visual-qa
          path: visual-qa/
          retention-days: 2
