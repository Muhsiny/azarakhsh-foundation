name: Quality and Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject obsolete legacy files and routes
        shell: bash
        run: |
          set -euo pipefail
          obsolete=(
            "app/chatgpt-auth.ts"
            "public/bismillah-original.svg"
            "public/bismillah.jpg"
            "public/media/council-emblem-color-master.svg"
            "public/media/council-emblem-hq.svg"
            "public/media/council-emblem.webp"
            "public/media/council-flag-cover.webp"
          )
          for path in "${obsolete[@]}"; do
            if [[ -e "$path" ]]; then
              echo "::error::Obsolete legacy file returned: $path"
              exit 1
            fi
          done
          if grep -R --line-number --exclude-dir=node_modules --exclude-dir=.git "admin/access-required\|chatGPTSignInPath\|ChatGPTUser" app; then
            echo "::error::Dead legacy authentication path returned."
            exit 1
          fi
          if grep -q "fileUrl: posts.fileUrl" app/api/posts/route.ts && grep -q "return Response.json({ post })" app/api/posts/route.ts; then
            echo "::error::Public posts API exposes direct internal file URLs."
            exit 1
          fi

      - name: Reject incomplete source markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'TODO|FIXME|@ts-ignore|console\.log\(' app worker --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs'; then
            echo "::error::Incomplete/debug source marker found."
            exit 1
          fi

      - name: Reject public CSS leaking into globals
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '^\.(hero|site-header|membership-page|publications-hero|archive-placeholder|knowledge-page)\b' app/globals.css; then
            echo "::error::Public presentation selector leaked back into globals.css."
            exit 1
          fi

      - name: Preserve research platform capabilities
        shell: bash
        run: |
          set -euo pipefail
          test -f app/api/contributions/route.ts
          test -f 'app/api/posts/[id]/quiz/route.ts'
          test -f 'app/api/posts/[id]/download/route.ts'
          test -f app/api/membership/route.ts
          test -f app/api/auth/login/route.ts
          test -f app/api/auth/password/route.ts
          test -f app/account/page.tsx
          test -f app/admin/contributions/page.tsx
          test -f app/admin/research-responses/page.tsx
          grep -q 'DownloadQuizGate' 'app/publications/[slug]/page.tsx'
          grep -q 'acceptedAnswers' 'app/api/posts/[id]/quiz/route.ts'
          grep -q 'quiz_attempt_locks' 'app/api/posts/[id]/quiz/route.ts'
          grep -q 'download-quiz-ip' 'app/api/posts/[id]/quiz/route.ts'
          grep -q 'item.status !== "published"' 'app/api/posts/[id]/download/route.ts'
          grep -q 'verifyAndConsumeDownloadPermit' 'app/api/posts/[id]/download/route.ts'
          grep -q 'used_at IS NULL' app/download-gate.ts
          grep -Fq 'return `pbkdf2${iterations}${digest}`;' app/admin-auth.ts
          grep -q 'knowledge-layout-single' 'app/pages/[slug]/page.tsx'
          grep -q 'DownloadQuizGate' 'app/pages/[slug]/page.tsx'
          grep -q 'href="/contribute"' app/components/PublicChrome.tsx
          grep -q 'href="/join"' app/components/PublicChrome.tsx
          grep -q 'href="/login"' app/components/PublicChrome.tsx
          grep -q 'AdminArchiveViewer' app/admin/page.tsx
          grep -q 'TextFormattingTools' app/admin/page.tsx
          grep -q 'LeaderPageManager' app/admin/page.tsx
          grep -q 'PageManager' app/admin/page.tsx

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Start local QA server
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/azarakhsh-qa.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/azarakhsh-qa.log
          exit 1

      - name: Smoke test every public route
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            "/" "/about" "/council" "/beheshti" "/archive" "/publications"
            "/standards" "/governance" "/contribute" "/contact" "/privacy"
            "/publications/hazarajat-1358-uprising-to-regional-government"
            "/en" "/join" "/login" "/account" "/admin/login"
          )
          for route in "${routes[@]}"; do
            echo "checking $route"
            curl -fsS --max-time 20 "http://127.0.0.1:4173$route" >/dev/null
          done

      - name: Verify member/admin login error routing
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          member_location=$(curl -sS -o /dev/null -D - --max-time 20 \
            -X POST -H "Origin: http://127.0.0.1:4173" \
            -F "loginPath=/login" -F "returnTo=/publications" \
            -F "email=qa-member@example.invalid" -F "password=invalid-password" \
            http://127.0.0.1:4173/api/auth/login | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}')
          admin_location=$(curl -sS -o /dev/null -D - --max-time 20 \
            -X POST -H "Origin: http://127.0.0.1:4173" \
            -F "loginPath=/admin/login" -F "returnTo=/admin" \
            -F "email=qa-admin@example.invalid" -F "password=invalid-password" \
            http://127.0.0.1:4173/api/auth/login | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}')
          [[ "$member_location" == *"/login?"* ]]
          [[ "$member_location" != *"/admin/login?"* ]]
          [[ "$admin_location" == *"/admin/login?"* ]]

      - name: Real desktop and mobile browser QA
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          CHROME=""
          for bin in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$bin" >/dev/null 2>&1; then CHROME=$(command -v "$bin"); break; fi
          done
          test -n "$CHROME"
          mkdir -p visual-qa
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222             --user-data-dir=/tmp/azarakhsh-cdp about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:9222/json >/dev/null && break
            sleep 1
          done

          cat > /tmp/capture.mjs <<'NODE'
          import fs from "node:fs";

          const routes = [
            "/", "/about", "/council", "/beheshti", "/archive", "/publications",
            "/standards", "/governance", "/contribute", "/contact", "/privacy",
            "/publications/hazarajat-1358-uprising-to-regional-government",
            "/en", "/join", "/login", "/admin/login"
          ];

          const pages = await (await fetch("http://127.0.0.1:9222/json")).json();
          const page = pages.find((item) => item.type === "page");
          if (!page) throw new Error("Chrome page target not found");

          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener("open", resolve, { once: true });
            ws.addEventListener("error", reject, { once: true });
          });

          let id = 0;
          const pending = new Map();
          ws.addEventListener("message", (event) => {
            const msg = JSON.parse(event.data);
            if (msg.id && pending.has(msg.id)) {
              pending.get(msg.id)(msg);
              pending.delete(msg.id);
            }
          });
          const send = (method, params = {}) => new Promise((resolve) => {
            const next = ++id;
            pending.set(next, resolve);
            ws.send(JSON.stringify({ id: next, method, params }));
          });

          await send("Page.enable");
          await send("Runtime.enable");

          async function navigate(path, width, height, mobile) {
            await send("Emulation.setDeviceMetricsOverride", {
              width, height, deviceScaleFactor: 1, mobile,
              screenWidth: width, screenHeight: height
            });
            await send("Page.navigate", { url: "http://127.0.0.1:4173" + path });
            await new Promise((resolve) => setTimeout(resolve, 1200));
            const result = await send("Runtime.evaluate", {
              expression: `(()=>({
                path: location.pathname,
                innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                bodyText: document.body.innerText.slice(0,500),
                brokenImages: [...document.images].filter(i => i.complete && i.naturalWidth === 0).map(i => i.getAttribute('src')),
                leaderSrc: document.querySelector('.az2-feature-leader .az2-feature-media img')?.getAttribute('src') || null,
                homeCopyTop: document.querySelector('.az2-hero-copy')?.getBoundingClientRect().top ?? null,
                homePortraitTop: document.querySelector('.az2-feature-leader .az2-feature-media')?.getBoundingClientRect().top ?? null,
                homePortraitHeight: document.querySelector('.az2-feature-leader .az2-feature-media')?.getBoundingClientRect().height ?? null,
                councilCopyTop: document.querySelector('.az-flagship-copy')?.getBoundingClientRect().top ?? null,
                councilEmblemTop: document.querySelector('.az-flagship-emblem')?.getBoundingClientRect().top ?? null,
                councilEmblemWidth: document.querySelector('.az-emblem-frame')?.getBoundingClientRect().width ?? null,
                councilHeroBackground: document.querySelector('.az-flagship-hero') ? getComputedStyle(document.querySelector('.az-flagship-hero')).backgroundColor : null,
                basmalaCenter: document.querySelector('.az2-basmala') ? (() => {
                  const r = document.querySelector('.az2-basmala').getBoundingClientRect();
                  return r.left + r.width / 2;
                })() : null,
                basmalaSrc: document.querySelector('.az2-basmala img')?.getAttribute('src') || null,
                flagCaptionHeight: document.querySelector('.az2-hero-visual figcaption')?.getBoundingClientRect().height ?? null,
                homeLeadAlign: document.querySelector('.az2-hero-copy > p') ? getComputedStyle(document.querySelector('.az2-hero-copy > p')).textAlign : null,
                navClosedHeight: document.querySelector('.az2-nav')?.getBoundingClientRect().height ?? null,
                headerBackground: document.querySelector('.az2-header') ? getComputedStyle(document.querySelector('.az2-header')).backgroundImage : null,
                councilEmblemSrc: document.querySelector('.az-flagship-emblem img')?.getAttribute('src') || null,
                knowledgeArticleWidth: document.querySelector('.knowledge-article')?.getBoundingClientRect().width ?? null,
                knowledgeLayoutWidth: document.querySelector('.knowledge-layout')?.getBoundingClientRect().width ?? null
              }))()`,
              returnByValue: true
            });
            return result.result.result.value;
          }

          const failures = [];
          for (const path of routes) {
            const metrics = await navigate(path, 390, 844, true);
            fs.appendFileSync("visual-qa/mobile-metrics.jsonl", JSON.stringify(metrics) + "\n");
            if (metrics.scrollWidth > metrics.innerWidth + 1) {
              failures.push(`${path}: horizontal overflow ${metrics.scrollWidth} > ${metrics.innerWidth}`);
            }
            if (metrics.brokenImages.length) {
              failures.push(`${path}: broken images ${metrics.brokenImages.join(", ")}`);
            }
            if (/Internal Server Error|Application error/i.test(metrics.bodyText)) {
              failures.push(`${path}: application error visible`);
            }
            if (path === "/" && metrics.leaderSrc !== "/media/beheshti-original.webp") {
              failures.push(`/: expected original Beheshti portrait, got ${metrics.leaderSrc}`);
            }
            if (path === "/" && !(metrics.homeCopyTop < metrics.homePortraitTop)) {
              failures.push(`/: mobile hero message must appear before the leader portrait`);
            }
            if (path === "/" && metrics.homePortraitHeight > 310) {
              failures.push(`/: mobile leader feature is too tall (${metrics.homePortraitHeight}px)`);
            }
            if (path === "/council" && !(metrics.councilCopyTop < metrics.councilEmblemTop)) {
              failures.push(`/council: research copy must appear before the emblem on mobile`);
            }
            if (path === "/council" && metrics.councilEmblemWidth > 170) {
              failures.push(`/council: emblem is too large on mobile (${metrics.councilEmblemWidth}px)`);
            }
            if (path === "/council" && metrics.councilHeroBackground === "rgb(8, 35, 29)") {
              failures.push(`/council: dark poster-style hero background regressed`);
            }
            if (path === "/" && Math.abs(metrics.basmalaCenter - metrics.innerWidth / 2) > 4) {
              failures.push(`/: Bismillah is not centered in the mobile sacred strip`);
            }
            if (path === "/" && metrics.basmalaSrc !== "/bismillah-transparent.svg") {
              failures.push(`/: approved transparent Bismillah asset regressed: ${metrics.basmalaSrc}`);
            }
            if (path === "/" && metrics.flagCaptionHeight > 46) {
              failures.push(`/: archival flag caption is too tall (${metrics.flagCaptionHeight}px)`);
            }
            if (path === "/" && metrics.homeLeadAlign !== "justify") {
              failures.push(`/: research lead text is not justified`);
            }
            if (path === "/" && metrics.navClosedHeight > 2) {
              failures.push(`/: closed mobile navigation leaked into the page (${metrics.navClosedHeight}px)`);
            }
            if (path === "/" && (!metrics.headerBackground || metrics.headerBackground === "none")) {
              failures.push(`/: diplomatic masthead background is missing`);
            }
            if (path === "/council" && metrics.councilEmblemSrc !== "/media/council-emblem-color.webp") {
              failures.push(`/council: authentic color emblem regressed: ${metrics.councilEmblemSrc}`);
            }
            if (path === "/about" && metrics.knowledgeArticleWidth !== null && metrics.knowledgeArticleWidth < 330) {
              failures.push(`/about: mobile institutional article is squeezed (${metrics.knowledgeArticleWidth}px)`);
            }
            if (path === "/about" && metrics.knowledgeLayoutWidth !== null && metrics.knowledgeLayoutWidth > metrics.innerWidth) {
              failures.push(`/about: institutional layout overflows mobile viewport`);
            }
          }

          async function capture(name, path, width, height, mobile) {
            await navigate(path, width, height, mobile);
            const layout = await send("Page.getLayoutMetrics");
            const contentHeight = Math.min(Math.ceil(layout.result.cssContentSize.height), mobile ? 2600 : 2200);
            const shot = await send("Page.captureScreenshot", {
              format: "png",
              fromSurface: true,
              captureBeyondViewport: true,
              clip: { x: 0, y: 0, width, height: contentHeight, scale: 1 }
            });
            fs.writeFileSync("visual-qa/" + name + ".png", Buffer.from(shot.result.data, "base64"));
          }

          await capture("home-desktop", "/", 1440, 1000, false);
          await capture("home-mobile", "/", 390, 844, true);
          await capture("leader-desktop", "/beheshti", 1440, 1000, false);
          await capture("leader-mobile", "/beheshti", 390, 844, true);
          await capture("council-desktop", "/council", 1440, 1000, false);
          await capture("council-mobile", "/council", 390, 844, true);
          await capture("about-desktop", "/about", 1440, 1000, false);
          await capture("about-mobile", "/about", 390, 844, true);
          await capture("standards-desktop", "/standards", 1440, 1000, false);
          await capture("governance-desktop", "/governance", 1440, 1000, false);
          await capture("publications-desktop", "/publications", 1440, 1000, false);
          await capture("publications-mobile", "/publications", 390, 844, true);
          await capture("archive-desktop", "/archive", 1440, 1000, false);
          await capture("contribute-desktop", "/contribute", 1440, 1000, false);
          await capture("contribute-mobile", "/contribute", 390, 844, true);
          await capture("contact-desktop", "/contact", 1440, 1000, false);
          await capture("english-desktop", "/en", 1440, 1000, false);
          await capture("join-desktop", "/join", 1440, 1000, false);
          await capture("join-mobile", "/join", 390, 844, true);
          await capture("login-desktop", "/login", 1440, 1000, false);
          await capture("login-mobile", "/login", 390, 844, true);
          await capture("admin-login-mobile", "/admin/login", 390, 844, true);

          ws.close();

          if (failures.length) {
            console.error(failures.join("\n"));
            process.exit(1);
          }
          NODE

          node /tmp/capture.mjs

      - name: Upload visual QA
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: azarakhsh-visual-qa
          path: visual-qa/
          retention-days: 2
