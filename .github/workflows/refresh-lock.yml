name: Refresh lockfile

on:
  push:
    branches: [security-hardening-2026-09-19]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: security-hardening-2026-09-19
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile after security dependency upgrades"
          git push origin HEAD:security-hardening-2026-09-19
