name: Secret capability probe
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[secret-probe]')
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub Actions secret write capability
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "temporary-probe-value" | gh secret set AZARAKHSH_SECRET_PROBE --repo "$GH_REPO"
          gh secret list --repo "$GH_REPO" | grep -q '^AZARAKHSH_SECRET_PROBE'
          gh secret delete AZARAKHSH_SECRET_PROBE --repo "$GH_REPO"
          echo "SECRET_WRITE_OK"
