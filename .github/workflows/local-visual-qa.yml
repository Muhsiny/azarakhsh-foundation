name: Local visual QA current commit

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-visual-qa:
    if: contains(github.event.head_commit.message, '[visual-local]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Start local app
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/azarakhsh-dev.log 2>&1 &
          echo $! > /tmp/azarakhsh-dev.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "Local app ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/azarakhsh-dev.log || true
          exit 1
      - name: Capture exact reference viewports
        shell: bash
        run: |
          set -euo pipefail
          CHROME=""
          for bin in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$bin" >/dev/null 2>&1; then CHROME=$(command -v "$bin"); break; fi
          done
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1536,2500 --force-device-scale-factor=1 \
            --screenshot=desktop-current.png http://127.0.0.1:4173/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=390,2200 --force-device-scale-factor=1 \
            --screenshot=mobile-current.png http://127.0.0.1:4173/
      - name: Upload screenshots and log
        uses: actions/upload-artifact@v4
        with:
          name: azarakhsh-local-current-visual
          path: |
            desktop-current.png
            mobile-current.png
            /tmp/azarakhsh-dev.log
          retention-days: 2
