name: Export project bundle

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write transfer guide
        run: |
          cat > TRANSFER-README.md <<'EOF'
# بنیاد آذرخش — Project Transfer Bundle

Exact source export from GitHub repository Muhsiny/azarakhsh-foundation, branch main.

## Source
Repository: https://github.com/Muhsiny/azarakhsh-foundation
Export commit is the commit recorded by this workflow.

## Hosting
Provider: Cloudflare Workers
Worker/service name: azarakhsh-foundation
Worker entry: worker/index.ts
Bindings are defined in wrangler.jsonc.

## Local setup
Node.js 22.13+ is required.
Run: npm ci
Development: npm run dev
Verification: npm run verify
Build: npm run build

## Deployment
Use Wrangler with the destination Cloudflare account:
npm run deploy
or
npx wrangler deploy

Do not commit Cloudflare tokens. Configure credentials/secrets separately in the new environment or GitHub Actions.

## Secrets excluded
.env files, private keys, certificate/key files, Cloudflare credentials and API tokens are excluded from this archive.

## Handoff
Use the repository contents as the source of truth. Do not reconstruct missing code from screenshots or memory.
EOF

      - name: Remove secrets and generated directories
        run: |
          rm -rf .git node_modules .next dist .wrangler
          find . -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) -delete

      - name: Create archive
        run: |
          tar -czf ../azarakhsh-foundation-project.tar.gz .
          zip -q -r ../azarakhsh-foundation-project.zip . -x '*/.DS_Store'

      - uses: actions/upload-artifact@v4
        with:
          name: azarakhsh-foundation-project
          path: |
            ../azarakhsh-foundation-project.zip
            ../azarakhsh-foundation-project.tar.gz
          retention-days: 14
