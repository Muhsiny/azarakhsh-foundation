plugins { id 'com.android.application' }

android {
    namespace 'org.nedayebeheshti.app'
    compileSdk 35

    defaultConfig {
        applicationId 'org.nedayebeheshti.app'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '1.5.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.0'
    implementation 'androidx.work:work-runtime:2.10.0'
}
