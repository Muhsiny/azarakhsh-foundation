plugins { id 'com.android.application' }

android {
    namespace 'org.nedayebeheshti.app'
    compileSdk 35

    defaultConfig {
        applicationId 'org.nedayebeheshti.app'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.0'
    implementation 'androidx.webkit:webkit:1.13.0'
}
